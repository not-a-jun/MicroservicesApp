server:
  port: 8084

spring:
  application:
    name: order-service
  config:
    import: optional:configserver:http://config-service:8888
  cloud:
    config:
      fail-fast: false
      retry:
        max-attempts: 3
        initial-interval: 5000

  saga:
    compensation:
      order-cancel: order-cancel-events
      payment-refund: payment-refund-events
      ticket-release: ticket-release-events
    retry-policy:
      initial-interval: 1000
      multiplier: 2
      max-attempts: 3
      max-interval: 10000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  datasource:
    hikari:
      maximum-pool-size: 5
      connection-timeout: 3000

resilience4j:
  circuitbreaker:
    instances:
      paymentService:
        failureRateThreshold: 50%
        minimumNumberOfCalls: 5

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: always

eureka:
  client:
    serviceUrl:
      defaultZone: http://service-registry:8761/eureka/