server:
  port: 8086

spring:
  application:
    name: ticket-service
  config:
    import: optional:configserver:http://config-service:8888

  datasource:
    hikari:
      maximum-pool-size: 5
      connection-timeout: 3000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  redis:
    host: ${REDIS_HOST:redis}
    port: ${REDIS_PORT:6379}
    timeout: ${REDIS_TIMEOUT:5000}

  kafka:
    bootstrap-servers: ${KAFKA_HOST:kafka:9092}
    consumer:
      group-id: ticket-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
    producer:
      acks: all
      retries: 3
    topic:
      ticket-events: ticket-events
      availability-events: availability-events
      payment-events: payment-events
      ticket-cancel-events: ticket-cancel-events
      payment-refund-events: payment-refund-events

  cloud:
    circuitbreaker:
      resilience4j:
        enabled: true

eureka:
  client:
    serviceUrl:
      defaultZone: http://service-registry:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
    healthcheck:
      enabled: true
  instance:
    hostname: ticket-service
    prefer-ip-address: false
    appname: ${spring.application.name}
    instance-id: ${spring.application.name}:${server.port}
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15

# Мониторинг
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: always

# Логирование
logging:
  level:
    root: INFO
    org.springframework.kafka: DEBUG
    com.example.ticketservice: DEBUG